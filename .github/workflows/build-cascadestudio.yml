name: Build CascadeStudio WASM

on:
  push:
    branches: [cascadestudio-v2]
  workflow_dispatch:

jobs:
  build:
    name: Build CascadeStudio WASM Module
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (with layer caching)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: custom-build-image
          load: true
          tags: ocjs-cascadestudio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: threading=single-threaded

      - name: Build CascadeStudio WASM
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/builds:/opencascade.js/builds \
            -v ${{ github.workspace }}/dist:/opencascade.js/dist \
            ocjs-cascadestudio:latest \
            builds/cascadestudio.yml

      - name: Verify output
        run: |
          ls -lh dist/
          test -f dist/cascadestudio.js || (echo "Missing cascadestudio.js" && exit 1)
          test -f dist/cascadestudio.wasm || (echo "Missing cascadestudio.wasm" && exit 1)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cascadestudio-wasm
          path: |
            dist/cascadestudio.js
            dist/cascadestudio.wasm
            dist/cascadestudio.d.ts

      - name: Commit dist to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet || git commit -m "Update CascadeStudio WASM build [skip ci]"
          git push
