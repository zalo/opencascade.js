      .function("IsDeletable", &ArrayType::IsDeletable, allow_raw_pointers()) \
      /* OCCT 8.0.1 added Resize(size_t, bool); pin the (int,int,bool) overload */ \
      .function("Resize", +[](ArrayType& self, const int theLower, const int theUpper, const bool theToCopyData) { self.Resize(theLower, theUpper, theToCopyData); })

    // Macro for constructor overloads (default + lower/upper)
    #define ARRAY1_CTORS(ArrayType) \
      struct ArrayType##_1 : public ArrayType { \
        ArrayType##_1() : ArrayType() {} \
      }; \
      class_<ArrayType##_1, base<ArrayType>>(#ArrayType "_1") \
        .constructor<>() \
