    typedef opencascade::handle<Poly_Triangulation> Handle_Poly_Triangulation;
    typedef opencascade::handle<Poly_PolygonOnTriangulation> Handle_Poly_PolygonOnTriangulation;
    typedef opencascade::handle<TColgp_HArray1OfPnt> Handle_TColgp_HArray1OfPnt;

    // Macro for Handle type registrations
    // Each Handle type gets: base class, _1 (null), _2 (from pointer), get(), IsNull()
    #define HANDLE_BINDINGS(HandleType, BaseType) \
      class_<HandleType>(#HandleType) \
        .function("IsNull", &HandleType::IsNull) \
        .function("Nullify", &HandleType::Nullify) \
        .function("get", &HandleType::get, allow_raw_pointers()) \
        ; \
      struct HandleType##_1 : public HandleType { \
        HandleType##_1() : HandleType() {} \
      }; \
      class_<HandleType##_1, base<HandleType>>(#HandleType "_1") \
        .constructor<>() \
        ; \
      struct HandleType##_2 : public HandleType { \
        HandleType##_2(const BaseType* p) : HandleType(p) {} \
      }; \
      class_<HandleType##_2, base<HandleType>>(#HandleType "_2") \
        .constructor<const BaseType*>() \
        ;

    EMSCRIPTEN_BINDINGS(AdditionalBindCode_HandleTypes) {
      HANDLE_BINDINGS(Handle_Geom_Curve, Geom_Curve)
      HANDLE_BINDINGS(Handle_Geom_BezierCurve, Geom_BezierCurve)
      HANDLE_BINDINGS(Handle_Geom_BSplineCurve, Geom_BSplineCurve)
      HANDLE_BINDINGS(Handle_Geom_TrimmedCurve, Geom_TrimmedCurve)
      HANDLE_BINDINGS(Handle_Geom_Circle, Geom_Circle)
      HANDLE_BINDINGS(Handle_Geom_Surface, Geom_Surface)
      HANDLE_BINDINGS(Handle_Poly_Triangulation, Poly_Triangulation)
      HANDLE_BINDINGS(Handle_Poly_PolygonOnTriangulation, Poly_PolygonOnTriangulation)
      HANDLE_BINDINGS(Handle_TColgp_HArray1OfPnt, TColgp_HArray1OfPnt)
    }
    #undef HANDLE_BINDINGS

