  #include <BRepAlgoAPI_Cut.hxx>
  #include <BRepAlgoAPI_Fuse.hxx>
  #include <BRepAlgoAPI_Common.hxx>
  #include <NCollection_List.hxx>
  #include <Message_ProgressRange.hxx>
  typedef NCollection_List<TopoDS_Shape> TopTools_ListOfShape;
  class OCJS {
  public:
    static Standard_Failure* getStandard_FailureData(intptr_t exceptionPtr) {
      return reinterpret_cast<Standard_Failure*>(exceptionPtr);
    }
    // OCCT 8.0 removed TopoDS_Shape::HashCode(). Provide a replacement.
    static int HashCode(const TopoDS_Shape& S, const int Upper) {
      return static_cast<int>(std::hash<TopoDS_Shape>{}(S) % static_cast<size_t>(Upper));
    }
    static TopoDS_Shape BooleanCut(const TopoDS_Shape& S1, const TopoDS_Shape& S2, double fuzz) {
      BRepAlgoAPI_Cut op;
      TopTools_ListOfShape args, tools;
      args.Append(S1); tools.Append(S2);
      op.SetArguments(args); op.SetTools(tools);
      op.SetFuzzyValue(fuzz);
      op.SetNonDestructive(true);
      op.Build(Message_ProgressRange());
      return op.Shape();
    }
    static TopoDS_Shape BooleanFuse(const TopoDS_Shape& S1, const TopoDS_Shape& S2, double fuzz) {
      BRepAlgoAPI_Fuse op;
      TopTools_ListOfShape args, tools;
      args.Append(S1); tools.Append(S2);
      op.SetArguments(args); op.SetTools(tools);
      op.SetFuzzyValue(fuzz);
      op.SetNonDestructive(true);
      op.Build(Message_ProgressRange());
      return op.Shape();
    }
    static TopoDS_Shape BooleanCommon(const TopoDS_Shape& S1, const TopoDS_Shape& S2, double fuzz) {
      BRepAlgoAPI_Common op;
      TopTools_ListOfShape args, tools;
      args.Append(S1); tools.Append(S2);
      op.SetArguments(args); op.SetTools(tools);
      op.SetFuzzyValue(fuzz);
      op.SetNonDestructive(true);
      op.Build(Message_ProgressRange());
      return op.Shape();
    }
  };

