  emccFlags:
    - "-flto"
    - "-fexceptions"
    - "-sDISABLE_EXCEPTION_CATCHING=0"
    - "-O3"
    - "-sEXPORT_ES6=1"

    - "-sEXPORTED_RUNTIME_METHODS=['FS']"
    - "-sINITIAL_MEMORY=100MB"
    - "-sMAXIMUM_MEMORY=4GB"
    - "-sALLOW_MEMORY_GROWTH=1"
    - "-sUSE_FREETYPE=1"
    - "-sLLD_REPORT_UNDEFINED"
    - "--no-entry"

  additionalBindCode: |
    // TopoDS_Cast and OCJS class definitions (duplicated from additionalCppCode
    // because additionalBindCode is a separate compilation unit)
    #include <TopoDS.hxx>
    #include <TopoDS_Shape.hxx>
    #include <TopoDS_Vertex.hxx>
    #include <TopoDS_Edge.hxx>
    #include <TopoDS_Wire.hxx>
    #include <TopoDS_Face.hxx>
    #include <TopoDS_Shell.hxx>
    #include <TopoDS_Solid.hxx>
    #include <TopoDS_Compound.hxx>
    #include <Standard_Failure.hxx>
    #include <functional>
    #include <BRepAlgoAPI_Cut.hxx>
    #include <BRepAlgoAPI_Fuse.hxx>
    #include <BRepAlgoAPI_Common.hxx>
    #include <NCollection_List.hxx>
    #include <Message_ProgressRange.hxx>
    typedef NCollection_List<TopoDS_Shape> TopTools_ListOfShape;
    class TopoDS_Cast {
    public:
      static const TopoDS_Vertex&    Vertex_1(const TopoDS_Shape& S) { return ::TopoDS::Vertex(S); }
      static       TopoDS_Vertex&    Vertex_2(TopoDS_Shape& S)       { return ::TopoDS::Vertex(S); }
      static const TopoDS_Edge&      Edge_1(const TopoDS_Shape& S)   { return ::TopoDS::Edge(S); }
      static       TopoDS_Edge&      Edge_2(TopoDS_Shape& S)         { return ::TopoDS::Edge(S); }
      static const TopoDS_Wire&      Wire_1(const TopoDS_Shape& S)   { return ::TopoDS::Wire(S); }
      static       TopoDS_Wire&      Wire_2(TopoDS_Shape& S)         { return ::TopoDS::Wire(S); }
      static const TopoDS_Face&      Face_1(const TopoDS_Shape& S)   { return ::TopoDS::Face(S); }
      static       TopoDS_Face&      Face_2(TopoDS_Shape& S)         { return ::TopoDS::Face(S); }
      static const TopoDS_Shell&     Shell_1(const TopoDS_Shape& S)  { return ::TopoDS::Shell(S); }
      static       TopoDS_Shell&     Shell_2(TopoDS_Shape& S)        { return ::TopoDS::Shell(S); }
      static const TopoDS_Solid&     Solid_1(const TopoDS_Shape& S)  { return ::TopoDS::Solid(S); }
      static       TopoDS_Solid&     Solid_2(TopoDS_Shape& S)        { return ::TopoDS::Solid(S); }
      static const TopoDS_Compound&  Compound_1(const TopoDS_Shape& S) { return ::TopoDS::Compound(S); }
      static       TopoDS_Compound&  Compound_2(TopoDS_Shape& S)      { return ::TopoDS::Compound(S); }
    };
    class OCJS {
    public:
      static Standard_Failure* getStandard_FailureData(intptr_t exceptionPtr) {
        return reinterpret_cast<Standard_Failure*>(exceptionPtr);
      }
      static int HashCode(const TopoDS_Shape& S, const int Upper) {
        return static_cast<int>(std::hash<TopoDS_Shape>{}(S) % static_cast<size_t>(Upper));
      }
      // Boolean helpers: single-build with fuzzy value + non-destructive mode.
      // The convenience constructors (Cut_3, Fuse_3, Common_3) build immediately
      // in destructive mode, making it impossible to set fuzzy value beforehand.
      // These helpers use the default constructor + SetArguments/SetTools pattern.
      static TopoDS_Shape BooleanCut(const TopoDS_Shape& S1, const TopoDS_Shape& S2, double fuzz) {
        BRepAlgoAPI_Cut op;
        TopTools_ListOfShape args, tools;
        args.Append(S1); tools.Append(S2);
        op.SetArguments(args); op.SetTools(tools);
        op.SetFuzzyValue(fuzz);
        op.SetNonDestructive(true);
        op.Build(Message_ProgressRange());
        return op.Shape();
      }
      static TopoDS_Shape BooleanFuse(const TopoDS_Shape& S1, const TopoDS_Shape& S2, double fuzz) {
        BRepAlgoAPI_Fuse op;
        TopTools_ListOfShape args, tools;
        args.Append(S1); tools.Append(S2);
        op.SetArguments(args); op.SetTools(tools);
        op.SetFuzzyValue(fuzz);
        op.SetNonDestructive(true);
        op.Build(Message_ProgressRange());
        return op.Shape();
      }
      static TopoDS_Shape BooleanCommon(const TopoDS_Shape& S1, const TopoDS_Shape& S2, double fuzz) {
        BRepAlgoAPI_Common op;
        TopTools_ListOfShape args, tools;
        args.Append(S1); tools.Append(S2);
        op.SetArguments(args); op.SetTools(tools);
        op.SetFuzzyValue(fuzz);
        op.SetNonDestructive(true);
        op.Build(Message_ProgressRange());
        return op.Shape();
      }
    };
    #include <gp_Pnt.hxx>
    #include <gp_Dir.hxx>
    #include <gp_Pnt2d.hxx>
    #include <gp_Vec.hxx>
    #include <NCollection_Array1.hxx>
    typedef NCollection_Array1<gp_Pnt> TColgp_Array1OfPnt;
    typedef NCollection_Array1<gp_Dir> TColgp_Array1OfDir;
    typedef NCollection_Array1<gp_Pnt2d> TColgp_Array1OfPnt2d;
    typedef NCollection_Array1<gp_Vec> TColgp_Array1OfVec;
    typedef NCollection_Array1<double> TColStd_Array1OfReal;
    typedef NCollection_Array1<int> TColStd_Array1OfInteger;
    #include <TopoDS_Shape.hxx>
    #undef CONSTRUCTOR
    #include <emscripten/bind.h>
    using namespace emscripten;

    // TopoDS_Cast and OCJS are custom classes (defined in additionalCppCode/myMain.h).
    // Their auto-generated binding .o files get stripped by LTO, so register them here
    // in additionalBindCode which is always linked.
    EMSCRIPTEN_BINDINGS(AdditionalBindCode_TopoDS_Cast) {
      class_<TopoDS_Cast>("TopoDS_Cast")
        .constructor<>()
        .class_function("Vertex_1", &TopoDS_Cast::Vertex_1, allow_raw_pointers())
        .class_function("Vertex_2", &TopoDS_Cast::Vertex_2, allow_raw_pointers())
        .class_function("Edge_1", &TopoDS_Cast::Edge_1, allow_raw_pointers())
        .class_function("Edge_2", &TopoDS_Cast::Edge_2, allow_raw_pointers())
        .class_function("Wire_1", &TopoDS_Cast::Wire_1, allow_raw_pointers())
        .class_function("Wire_2", &TopoDS_Cast::Wire_2, allow_raw_pointers())
        .class_function("Face_1", &TopoDS_Cast::Face_1, allow_raw_pointers())
        .class_function("Face_2", &TopoDS_Cast::Face_2, allow_raw_pointers())
        .class_function("Shell_1", &TopoDS_Cast::Shell_1, allow_raw_pointers())
        .class_function("Shell_2", &TopoDS_Cast::Shell_2, allow_raw_pointers())
        .class_function("Solid_1", &TopoDS_Cast::Solid_1, allow_raw_pointers())
        .class_function("Solid_2", &TopoDS_Cast::Solid_2, allow_raw_pointers())
        .class_function("Compound_1", &TopoDS_Cast::Compound_1, allow_raw_pointers())
        .class_function("Compound_2", &TopoDS_Cast::Compound_2, allow_raw_pointers())
        ;
    }
    EMSCRIPTEN_BINDINGS(AdditionalBindCode_OCJS) {
      class_<OCJS>("OCJS")
        .constructor<>()
        .class_function("getStandard_FailureData", &OCJS::getStandard_FailureData, allow_raw_pointers())
        .class_function("HashCode", &OCJS::HashCode, allow_raw_pointers())
        .class_function("BooleanCut", &OCJS::BooleanCut, allow_raw_pointers())
        .class_function("BooleanFuse", &OCJS::BooleanFuse, allow_raw_pointers())
        .class_function("BooleanCommon", &OCJS::BooleanCommon, allow_raw_pointers())
        ;
    }

    // TopTools_ListOfShape (NCollection_List<TopoDS_Shape>) — needed for
    // SetArguments/SetTools on boolean operations when using the _1 constructor
    EMSCRIPTEN_BINDINGS(AdditionalBindCode_TopTools_ListOfShape) {
      class_<TopTools_ListOfShape>("TopTools_ListOfShape")
        .constructor<>()
        .function("Append", +[](TopTools_ListOfShape& self, const TopoDS_Shape& S) -> TopoDS_Shape& { return self.Append(S); }, allow_raw_pointers())
        .function("Size", &TopTools_ListOfShape::Size)
        .function("Clear", +[](TopTools_ListOfShape& self) { self.Clear(); })
        .function("First", +[](TopTools_ListOfShape& self) -> const TopoDS_Shape& { return self.First(); }, allow_raw_pointers())
        ;
    }

    // Indexed data maps used by build123d's OCP surface. The generator cannot
    // process NCollection_IndexedDataMap typedefs (default template args), so
    // register the minimal query surface by hand.
    #include <TopExp.hxx>
    #include <TopTools_ShapeMapHasher.hxx>
    #include <NCollection_IndexedDataMap.hxx>
    #include <TCollection_AsciiString.hxx>
    typedef NCollection_IndexedDataMap<TopoDS_Shape, TopTools_ListOfShape, TopTools_ShapeMapHasher> TopTools_IndexedDataMapOfShapeListOfShape;
    typedef NCollection_IndexedDataMap<TCollection_AsciiString, TCollection_AsciiString> TColStd_IndexedDataMapOfStringString;
    EMSCRIPTEN_BINDINGS(AdditionalBindCode_IndexedDataMaps) {
      class_<TopTools_IndexedDataMapOfShapeListOfShape>("TopTools_IndexedDataMapOfShapeListOfShape")
        .constructor<>()
        .function("Extent", &TopTools_IndexedDataMapOfShapeListOfShape::Extent)
        .function("Contains", +[](const TopTools_IndexedDataMapOfShapeListOfShape& self, const TopoDS_Shape& S) { return self.Contains(S); })
        .function("FindKey", +[](const TopTools_IndexedDataMapOfShapeListOfShape& self, int i) -> const TopoDS_Shape& { return self.FindKey(i); }, allow_raw_pointers())
        .function("FindFromIndex", +[](const TopTools_IndexedDataMapOfShapeListOfShape& self, int i) -> const TopTools_ListOfShape& { return self.FindFromIndex(i); }, allow_raw_pointers())
        .function("FindFromKey", +[](const TopTools_IndexedDataMapOfShapeListOfShape& self, const TopoDS_Shape& S) -> const TopTools_ListOfShape& { return self.FindFromKey(S); }, allow_raw_pointers())
        .function("FindIndex", +[](const TopTools_IndexedDataMapOfShapeListOfShape& self, const TopoDS_Shape& S) { return self.FindIndex(S); })
        .function("Clear", +[](TopTools_IndexedDataMapOfShapeListOfShape& self) { self.Clear(); })
        ;
      class_<TColStd_IndexedDataMapOfStringString>("TColStd_IndexedDataMapOfStringString")
        .constructor<>()
        .function("Extent", &TColStd_IndexedDataMapOfStringString::Extent)
        .function("Add", +[](TColStd_IndexedDataMapOfStringString& self, const TCollection_AsciiString& k, const TCollection_AsciiString& v) { return self.Add(k, v); })
        ;
      // (TopExp::MapShapesAndAncestors comes from the generated TopExp binding;
      // its map argument resolves against the registration above.)
    }

    // Constructible heap arrays for GeomAPI_Interpolate /
    // GeomAPI_PointsToBSplineSurface inputs (the algorithms and the Handle
    // wrappers are generated; the concrete array types are not).
    #include <NCollection_HArray1.hxx>
    #include <NCollection_Array2.hxx>
    typedef NCollection_HArray1<gp_Pnt> TColgp_HArray1OfPnt;
    typedef NCollection_HArray1<bool> TColStd_HArray1OfBoolean;
    typedef opencascade::handle<TColStd_HArray1OfBoolean> Handle_TColStd_HArray1OfBoolean;
    typedef NCollection_Array2<gp_Pnt> TColgp_Array2OfPnt;
    EMSCRIPTEN_BINDINGS(AdditionalBindCode_InterpolationArrays) {
      class_<TColgp_HArray1OfPnt>("TColgp_HArray1OfPnt")
        .function("SetValue", +[](TColgp_HArray1OfPnt& self, int idx, const gp_Pnt& val) { self.SetValue(idx, val); })
        .function("Value", +[](const TColgp_HArray1OfPnt& self, int idx) -> const gp_Pnt& { return self.Value(idx); }, allow_raw_pointers())
