    //
    // Macro for common NCollection_Array1 methods
    #define ARRAY1_METHODS(ArrayType) \
      .function("Size", &ArrayType::Size, allow_raw_pointers()) \
      .function("Length", &ArrayType::Length, allow_raw_pointers()) \
      .function("IsEmpty", &ArrayType::IsEmpty, allow_raw_pointers()) \
