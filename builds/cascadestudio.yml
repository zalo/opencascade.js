    // Handle types: auto-generated bindings include ALL OCCT headers in the preamble,
    // making compilation extremely slow (~7hrs for 2000+ files). Register manually here
    // with minimal includes for the specific Handle types CascadeStudio needs.
    //
    // Pattern: Handle_X is typedef opencascade::handle<X>.
    // _1 = default constructor (null handle)
    // _2 = from pointer constructor (handle(const T*)) — used for upcasting
    // Methods: get(), IsNull()
    #include <Standard_Handle.hxx>
    #include <Geom_Curve.hxx>
    #include <Geom_BezierCurve.hxx>
    #include <Geom_BSplineCurve.hxx>
    #include <Geom_TrimmedCurve.hxx>
    #include <Geom_Circle.hxx>
    #include <Geom_Surface.hxx>
