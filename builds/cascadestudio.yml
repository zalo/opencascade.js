    - symbol: gp_Vec
    - symbol: gp_Dir
    - symbol: gp_Ax1
    - symbol: gp_Ax2
    - symbol: gp_Ax3
    - symbol: gp_Pln
    - symbol: gp_Trsf
    - symbol: gp_Pnt2d
    - symbol: gp_Dir2d
    - symbol: gp_Ax2d

    # Topology Data Structures
    - symbol: TopoDS_Cast
    - symbol: TopoDS_Shape
    - symbol: TopoDS_Compound
    - symbol: TopoDS_Solid
    - symbol: TopoDS_Shell
    - symbol: TopoDS_Face
    - symbol: TopoDS_Wire
    - symbol: TopoDS_Edge
    - symbol: TopoDS_Vertex
    - symbol: TopoDS_Iterator
    - symbol: TopoDS_Builder
    - symbol: TopExp_Explorer
    - symbol: TopLoc_Location

